  selector:
    matchLabels:
      app: cloudwork-frontend
  template:
    metadata:
      labels:
        app: cloudwork-frontend
    spec:
      containers:
        - name: frontend
          image: cloudwork/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"

