apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudwork-gateway
  namespace: cloudwork
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudwork-gateway
  template:
    metadata:
      labels:
        app: cloudwork-gateway
    spec:
      containers:
        - name: gateway
          image: cloudwork/ruoyi-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: nacos:8848
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: cloudwork-gateway
  namespace: cloudwork
spec:
  selector:
    app: cloudwork-gateway
  ports:
    - port: 8080
      targetPort: 8080

